name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            asset_glob: "src-tauri/target/release/bundle/**/*.msi"
            asset_glob2: "src-tauri/target/release/bundle/**/*.exe"
          - platform: macos-latest
            asset_glob: "src-tauri/target/release/bundle/**/*.dmg"
          - platform: ubuntu-22.04
            asset_glob: "src-tauri/target/release/bundle/**/*.deb"
            asset_glob2: "src-tauri/target/release/bundle/**/*.AppImage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-dist
          shopt -s nullglob globstar
          for g in "${{ matrix.asset_glob }}" "${{ matrix.asset_glob2 }}"; do
            for f in $g; do
              cp "$f" release-dist/
            done
          done
          ls -la release-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release-dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
